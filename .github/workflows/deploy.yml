name: Build and Release MediaMTX PROD

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediamtx-production-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux AMD64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go environment
        run: |
          go version
          go env GOOS GOARCH GOMOD

      - name: Generate embedded assets
        run: |
          set -e

          echo "Generating MediaMTX version..."

          (
            cd internal/core
            go generate -x
          )

          test -s internal/core/VERSION

          echo "Generating HLS assets..."

          (
            cd internal/servers/hls
            go generate -x
          )

          test -s internal/servers/hls/hls.min.js

          echo "Generated assets:"
          ls -lah internal/core/VERSION
          ls -lah internal/servers/hls/hls.min.js

      - name: Verify embedded assets
        run: |
          test -s internal/core/VERSION
          test -s internal/servers/hls/hls.min.js

          echo "All embedded assets are present."

      - name: Run generate for all packages
        run: go generate ./...

      - name: Run tests
        run: go test ./...

      - name: Build MediaMTX
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o mediamtx .

      - name: Verify binary
        run: |
          file mediamtx
          chmod +x mediamtx
          ./mediamtx --version

      - name: Package binary
        run: |
          tar -czf mediamtx-linux-amd64.tar.gz mediamtx

          sha256sum mediamtx-linux-amd64.tar.gz \
            > mediamtx-linux-amd64.tar.gz.sha256

          ls -lh mediamtx-linux-amd64.tar.gz*
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediamtx-linux-amd64
          path: |
            mediamtx-linux-amd64.tar.gz
            mediamtx-linux-amd64.tar.gz.sha256
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mediamtx-${{ github.sha }}
          name: MediaMTX ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          body: |
            Automated MediaMTX production release.

            Commit: ${{ github.sha }}
            Branch: master
            Platform: Linux AMD64
          files: |
            mediamtx-linux-amd64.tar.gz
            mediamtx-linux-amd64.tar.gz.sha256
          make_latest: true
          fail_on_unmatched_files: true